[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stk"
version = "0.5.0"
description = "미국 개별주 시나리오별 주가 흐름 예측 (몬테카를로 시뮬레이션)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
stk = "stk.cli:main"

[tool.setuptools]
packages = ["stk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# E501: 한글 문구·HTML/JS 템플릿의 긴 줄 허용, E731: 짧은 좌표 변환 람다 허용, B905: zip 길이는 구조상 동일
ignore = ["E501", "E731", "B905"]
