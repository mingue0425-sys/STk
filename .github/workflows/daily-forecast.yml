name: Daily forecast

# 평일 미국 장 마감 후 관심종목(watchlist.txt)을 1개월·6개월 기간으로 예측해
# forecast-reports 브랜치에 사이트(첫 화면 + 기간별 대시보드)와 누적 기록을 올립니다.
# - 코드 브랜치에는 아무것도 커밋하지 않습니다 (결과는 forecast-reports 브랜치에만).
# - forecast-reports/data/forecasts.jsonl 에 예측이 쌓이고, 날짜가 지난 예측은 자동으로 실제 주가와 비교됩니다.
# - GitHub Pages 를 forecast-reports 브랜치(/)로 켜면 웹 페이지로 볼 수 있습니다 (README 참고).
# - 알림(선택): 저장소 변수 STK_ALERTS=on 이면 흐름 변화가 있을 때 이슈에 댓글로 알려줍니다.

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 평일 22:17 UTC = 미국 동부 17:17(겨울)/18:17(여름), 한국 시간 다음날 07:17
  workflow_dispatch:
    inputs:
      horizons:
        description: "예측 기간 목록, 쉼표 구분 (예: 1m,6m 또는 3m)"
        required: false
        default: "1m,6m"
      tickers:
        description: "종목 (공백/쉼표 구분). 비우면 watchlist.txt 사용"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

env:
  REPORTS_BRANCH: forecast-reports
  HORIZONS: ${{ inputs.horizons || '1m,6m' }}
  TICKERS: ${{ inputs.tickers || '' }}
  ALERTS: ${{ vars.STK_ALERTS || 'off' }}

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Validate inputs
        run: |
          if ! [[ "$HORIZONS" =~ ^[0-9]+(\.[0-9]+)?[dwmy]?(,[0-9]+(\.[0-9]+)?[dwmy]?)*$ ]]; then
            echo "::error::예측 기간 형식 오류: '$HORIZONS' (예: 1m,6m)"; exit 1
          fi
          if ! [[ "$TICKERS" =~ ^[A-Za-z0-9.,^\ -]*$ ]]; then
            echo "::error::종목 입력에 허용되지 않는 문자가 있습니다: '$TICKERS'"; exit 1
          fi

      - name: Prepare reports branch
        run: |
          if git ls-remote --exit-code --heads origin "$REPORTS_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$REPORTS_BRANCH:refs/remotes/origin/$REPORTS_BRANCH"
            git worktree add -B "$REPORTS_BRANCH" site "origin/$REPORTS_BRANCH"
          else
            echo "forecast-reports 브랜치를 새로 만듭니다"
            git worktree add --detach site
            git -C site checkout --orphan "$REPORTS_BRANCH"
            git -C site rm -rf --quiet .
          fi
          rm -rf site/latest   # 이전 버전 사이트 구조 정리 (기간별 폴더는 publish 가 다시 만듦)

      - name: Forecast and build site
        run: |
          if [ -n "$TICKERS" ]; then
            SRC="${TICKERS//,/ }"
          else
            SRC="--file watchlist.txt"
          fi
          # shellcheck disable=SC2086  # 종목 목록은 공백으로 나눠 전달
          python -m stk publish $SRC --horizons "$HORIZONS" --site site --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Track record
        run: python -m stk track --log site/data/forecasts.jsonl | tee site/track.txt

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: forecast-site-${{ github.run_number }}
          path: |
            site
            !site/.git
          retention-days: 14

      - name: Publish to reports branch
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -q -m "Forecast $(date -u +%F) (${HORIZONS})"
          git push origin "HEAD:$REPORTS_BRANCH"

      - name: Alert on flow changes (opt-in)
        if: env.ALERTS == 'on' && hashFiles('site/alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="관심종목 흐름 변화 알림"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body-file site/alerts.md
          else
            gh issue comment "$NUM" --body-file site/alerts.md
          fi

  pages:
    # forecast-reports 브랜치 내용을 GitHub Pages 로 배포 → https://<사용자명>.github.io/<저장소>/
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: forecast-reports
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 가 꺼져 있으면 켜기 시도 (권한이 없으면 Settings → Pages → Source: GitHub Actions)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

